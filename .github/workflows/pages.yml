name: Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Keep production deployments ordered; PR runs do not block production.
concurrency:
  group: website-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    env:
      CONTAINER_ENGINE: docker
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Determine publication scope
        id: mode
        env:
          PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'psk-og-marienheide/website' }}
        run: echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Read existing Pages metadata
        id: pages
        if: steps.mode.outputs.publish == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: false
      - name: Checker regression tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Validate root and project-prefix URLs
        if: steps.mode.outputs.publish != 'true'
        run: |
          BASE_URL=https://example.invalid/ make build
          BASE_URL=https://example.invalid/repository/ make build
      - name: Build and check production artifact
        if: steps.mode.outputs.publish == 'true'
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          test -n "$PAGES_BASE_URL"
          BASE_URL="${PAGES_BASE_URL%/}/" make build
      - name: Upload checked site
        if: steps.mode.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: public

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
